name: Update LoanStatus API Data

on:
  schedule:
    # รันทุกวันเวลา 12:00 UTC (แก้เป็นเวลาที่ต้องการได้)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  update_data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Create credentials.json
        run: echo "${{ secrets.GCP_CREDENTIALS }}" > credentials.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        env:
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PASS: ${{ secrets.ORACLE_PASS }}
          ORACLE_DSN: ${{ secrets.ORACLE_DSN }}
          SPREADSHEET_NAME: ${{ secrets.SPREADSHEET_NAME }}
        run: python update_loanstatus.py

name: Run Flask + Oracle to Google Sheet

on:
  schedule:
    - cron: '0 1 * * *'  # เวลา 08:00 ไทยทุกวัน
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Create credentials.json from secret
      run: echo "${{ secrets.GCP_CREDENTIALS }}" > credentials.json

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Script
      run: python flask_ngrok_with_sheet.py



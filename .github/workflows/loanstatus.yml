name: Update LoanStatus API Data

on:
  schedule:
    - cron: '0 5 * * *'  # รันทุกวันเวลา 12:00 ไทย (05:00 UTC)
  workflow_dispatch:  # รันด้วยมือได้

jobs:
  update_data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Create credentials.json
        run: echo "${{ secrets.GCP_CREDENTIALS }}" > credentials.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        env:
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PASS: ${{ secrets.ORACLE_PASS }}
          ORACLE_DSN: ${{ secrets.ORACLE_DSN }}
        run: python flask_ngrok_with_sheet.py
